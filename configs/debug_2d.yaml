data:
  data_path: [1, 32, 32, 12]
  task: 'debug'
  reduce_res: 1
  reduce_batch: 1

model:
  # architecture parameters
  hdim: 64
  layers: 4
  dropout: 0.1
  modes: [16, 16]
  
  # One of: OneStep, AutoRegressive, PushForward, Uncertainty, Static, TimeDilated, ARTimeDilated
  model_type: 'ARTimeDilated'
  # Combination of: mass, momentum, energy, vorticity
  scaling: [] #, 'momentum']
  periodic: true
  vorticity: false
  grad: false

  pde_weight: 0.1 # do not go over 0.1
  timesteps: 3
  history: 2
  dilation: 4

training:
  batch_size: 1
  learning_rate: 0.00001
  weight_decay: 0.0
  epochs: 500
  patience: 100
  gpus: 0

  