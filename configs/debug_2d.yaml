data:
  data_path: [20, 32, 32, 10]
  task: 'debug'
  reduce_res: 1
  reduce_batch: 1

model:
  # architecture parameters
  hdim: 10
  layers: 2
  dropout: 0.1
  modes: [5, 5]
  
  # One of: OneStep, AutoRegressive, PushForward, Uncertainty, Static
  model_type: 'PushForward'
  # Combination of: mass, momentum, energy, vorticity
  scaling: []
  periodic: true
  vorticity: false
  grad: false

  pde_weight: 0
  timesteps: 2
  history: 1

training:
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 10
  patience: 10
  gpus: 0

  