data:
  data_path: "/fs/scratch/PAS2170/pdebench/data/2D/CFD/2D_Train_Rand/2d_cfd_rand_m0.1_eta1e-08_zeta1e-08_periodic_512_train.hdf5"
  task: 'pdebench'
  reduce_res: 1
  reduce_batch: 1

model:
  # architecture parameters
  hdim: 64
  layers: 4
  heads: 4
  kernel_size: 1
  dropout: 0.1
  modes: [24, 24]
  
  # One of: OneStep, AutoRegressive, PushForward, Uncertainty, Static
  model_type: 'OneStep'
  # Combination of: mass, momentum, energy, vorticity
  scaling: []
  periodic: true
  vorticicity: false
  grad: false

  pde_weight: 0
  timesteps: 1
  history: 1

training:
  batch_size: 64
  learning_rate: 1e-5
  weight_decay: 0.0
  epochs: 100
  patience: 30
  gpus: 1  

  