data:
  data_path: "/local/storage/current.33/cfd/2D/CFD/2D_Train_Rand/2d_cfd_rand_m0.1_eta1e-08_zeta1e-08_periodic_512_train.hdf5"
  # data_path: "/local/storage/current.33/cfd/2D/CFD/2D_Train_Turb/2d_cfd_turb_m0.1_eta1e-08_zeta1e-08_periodic_512_train.hdf5"
  task: 'pdebench'
  reduce_res: 4
  reduce_batch: 1
  conservative_form: true

model:
  # architecture parameters
  hdim: 512
  layers: 4
  nheads: 4
  dropout: 0.0
  modes: [32, 32]
  dpot: true
  
  # One of: OneStep, AutoRegressive, PushForward, Uncertainty, Static
  model_type: 'AutoRegressive'
  # Combination of: mass, momentum, energy, vorticity
  scaling: ['mass', 'momentum']
  periodic: true
  vorticity: false
  grad: false
  grad_features: false

  pde_weight: 0.0
  timesteps: 2
  history: 1
  dilation: 1
  patch_size: 4

training:
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 100
  patience: 100
  gpus: 1
